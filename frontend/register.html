<!doctype html>
<html lang="az">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qeydiyyat | Shoply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="auth-page"><a class="brand auth-brand" href="index.html"><span>shop</span>ly.</a>
    <main class="auth-wrap">
        <section class="auth-card">
            <p class="eyebrow">Yeni hesab</p>
            <h1>Qeydiyyatdan keçin</h1>
            <p class="muted">Bir neçə saniyədə alış-verişə başlayın.</p>
            <form id="register-form" class="form-stack"><label>İstifadəçi adı<input name="username" required minlength="3" maxlength="50" pattern="[\p{L}\p{N}_]+"
                        autocomplete="username" /><small class="field-help">3–50 simvol; yalnız hərf, rəqəm və altdan xətt (_) istifadə edin.</small></label><label>E-poçt<input type="email" name="email" required maxlength="255"
                        autocomplete="email" /><small class="field-help">Düzgün email formatı yazın.</small></label><label>Parol<input type="password" name="password" required
                        minlength="8" maxlength="72" pattern="\S+" autocomplete="new-password" /><small class="field-help">Minimum 8, maksimum 72 simvol; boşluq olmamalıdır.</small></label><button class="btn btn-primary"
                    type="submit">Hesab yarat</button></form>
            <p class="form-foot">Hesabınız var? <a href="login.html">Daxil olun</a></p>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>

</html>
